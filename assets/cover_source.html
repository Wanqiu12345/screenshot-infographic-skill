<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1280px;height:640px;overflow:hidden;}
  .stage{width:1280px;height:640px;position:relative;background:#FBFAF8;color:#12203C;
    font-family:'PingFang SC','HarmonyOS Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;}
  .stage::before{content:'';position:absolute;left:0;top:0;right:0;height:1px;background:#DED9CE;}

  /* ---- 左列：文案 ---- */
  .hero{position:absolute;left:84px;top:56px;width:600px;}
  .kick{font-size:17px;letter-spacing:6px;font-weight:600;color:#B08D45;}
  .title{font-size:64px;font-weight:800;line-height:1.18;letter-spacing:-3px;
    color:#1A3A6B;margin-top:22px;}
  .rule{width:88px;height:4px;background:#B08D45;margin:28px 0 24px;}
  .tag{font-size:24px;line-height:1.6;color:#3E4759;max-width:560px;}
  .tag b{color:#1A3A6B;font-weight:700;}
  .tag .ar{color:#B08D45;font-weight:700;}
  .pills{position:absolute;left:84px;bottom:96px;display:flex;gap:14px;}
  .pill{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:17px;
    letter-spacing:2px;font-weight:600;border-radius:999px;}
  .pill.a{background:#E9EEF6;color:#1A3A6B;border:1px solid #C9D6E8;}
  .pill.b{background:#F5EFE1;color:#8A6D2E;border:1px solid #E0D3B4;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .pill.a .dot{background:#1A3A6B;}
  .pill.b .dot{background:#B08D45;}

  /* ---- 右列：两张示意卡（纯几何微缩，无彩色投影） ---- */
  .cards{position:absolute;right:84px;top:0;width:470px;height:640px;}
  .card{position:absolute;background:#FFFFFF;border:1px solid #DED9CE;border-radius:14px;
    box-shadow:0 14px 34px rgba(18,32,60,.08);overflow:hidden;}
  .cardA{width:340px;height:400px;right:96px;top:92px;transform:rotate(-2.5deg);}
  .cardB{width:300px;height:330px;right:6px;top:150px;transform:rotate(2deg);}

  /* 卡A：截图模式 —— 终端窗口微缩 */
  .wbar{display:flex;align-items:center;height:40px;padding:0 16px;
    border-bottom:1px solid #EAE5DA;}
  .wdot{width:9px;height:9px;border-radius:50%;border:1.5px solid #A6A096;margin-right:7px;}
  .wdot.on{background:#B08D45;border-color:#B08D45;}
  .wtitle{margin-left:auto;font-family:Consolas,'Courier New',monospace;font-size:13px;
    letter-spacing:2px;color:#A6A096;}
  .wbody{padding:18px;}
  .shot{height:120px;border:1px solid #DED9CE;border-radius:8px;background:#E9EEF6;
    position:relative;}
  .shot .lb{position:absolute;left:12px;top:10px;
    font-family:Consolas,monospace;font-size:12px;letter-spacing:3px;color:#2E5490;}
  .row{height:12px;border-radius:6px;background:#EAE5DA;margin-top:14px;}
  .row.gold{background:#C9A961;width:46%;}
  .row.blue{background:#C9D6E8;width:64%;}
  .chips{display:flex;gap:10px;margin-top:18px;}
  .chip{flex:1;height:44px;border:1px solid #DED9CE;border-radius:8px;background:#FBFAF8;}
  .chip.g{border-color:#B08D45;background:#F5EFE1;}

  /* 卡B：文案模式 —— 信息图微缩 */
  .bk{font-size:12px;letter-spacing:4px;font-weight:700;color:#B08D45;margin:22px 24px 0;}
  .bignum{display:flex;align-items:baseline;margin:6px 24px 0;}
  .bignum .n{font-size:84px;font-weight:800;color:#1A3A6B;letter-spacing:-4px;line-height:1;}
  .bignum .u{font-size:22px;font-weight:700;color:#2E5490;margin-left:8px;}
  .bl{height:11px;border-radius:5px;background:#EAE5DA;margin:12px 24px 0;}
  .bfoot{margin:20px 24px 0;padding-top:12px;border-top:1px solid #EAE5DA;
    font-size:12px;letter-spacing:2px;color:#A6A096;}

  /* ---- 页脚 ---- */
  .foot{position:absolute;left:84px;right:84px;bottom:34px;display:flex;
    justify-content:space-between;align-items:center;
    border-top:1px solid #DED9CE;padding-top:16px;
    font-size:14px;letter-spacing:3px;color:#A6A096;}
</style>
</head>
<body>
<div class="stage">
  <div class="hero">
    <div class="kick">跨平台 AGENT SKILL</div>
    <div class="title">截图教程图 &amp; 信息图<br>配图生成器</div>
    <div class="rule"></div>
    <div class="tag">一张<b>截图</b> 或 一段<b>文案</b><br><span class="ar">→</span> 一整套<b>发布级配图</b></div>
  </div>

  <div class="pills">
    <span class="pill a"><span class="dot"></span>截图模式</span>
    <span class="pill b"><span class="dot"></span>纯文案模式</span>
  </div>

  <div class="cards">
    <div class="card cardA">
      <div class="wbar">
        <span class="wdot"></span><span class="wdot on"></span><span class="wdot"></span>
        <span class="wtitle">screenshot_tutorial</span>
      </div>
      <div class="wbody">
        <div class="shot"><span class="lb">SCREENSHOT</span></div>
        <div class="row blue"></div>
        <div class="row"></div>
        <div class="row gold"></div>
        <div class="chips"><span class="chip"></span><span class="chip g"></span><span class="chip"></span></div>
      </div>
    </div>

    <div class="card cardB">
      <div class="bk">纯文案</div>
      <div class="bignum"><span class="n">8</span><span class="u">种页型</span></div>
      <div class="bl" style="width:82%"></div>
      <div class="bl" style="width:64%"></div>
      <div class="bl" style="width:74%"></div>
      <div class="bfoot">1080 × 1440 · 晚秋简约</div>
    </div>
  </div>

  <div class="foot">
    <span>晚秋AI日记 · 晚秋简约风</span>
    <span>完全离线 · 只依赖 PILLOW</span>
  </div>
</div>
</body>
</html>
