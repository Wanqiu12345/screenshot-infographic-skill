<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{
  --page-bg: __PAGE_BG__;
  --card-bg: __CARD_BG__;
  --accent: __ACCENT__;
  --accent-soft: __ACCENT_SOFT__;
  --secondary: __SECONDARY__;
  --accent2: __ACCENT2__;
  --accent2-soft: __ACCENT2_SOFT__;
  --text-main: __TEXT_MAIN__;
  --text-sub: __TEXT_SUB__;
  --line: __LINE__;
  --radius: __RADIUS__px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--page-bg);}
.page{
  width:1080px;height:1440px;background:var(--page-bg);
  padding:92px 88px 64px;
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text-main);
  display:flex;flex-direction:column;align-items:center;
}
.kicker{
  font-size:27px;letter-spacing:6px;font-weight:700;color:var(--accent);
  text-align:center;
}
.hero{
  flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.icon-frame{
  width:260px;height:260px;border-radius:60px;
  background:var(--card-bg);
  box-shadow:0 30px 70px var(--accent-soft);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.icon-frame img{width:100%;height:100%;object-fit:contain;display:block;}
.icon-frame .icon-text{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:130px;font-weight:800;color:#fff;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--secondary));
}
.brand-main{
  margin-top:60px;width:100%;text-align:center;
  font-size:120px;font-weight:800;line-height:1.14;color:var(--text-main);
  letter-spacing:1px;
}
.brand-sub{
  margin-top:14px;text-align:center;font-size:38px;font-weight:600;
  color:var(--text-sub);letter-spacing:3px;line-height:1.3;
}
.slogan{
  margin-top:42px;text-align:center;font-size:46px;font-weight:700;
  color:var(--accent);letter-spacing:2px;
}
.desc{
  margin-top:16px;text-align:center;font-size:29px;color:var(--text-sub);
  max-width:760px;line-height:1.5;
}
.watermark{
  font-size:23px;color:var(--text-sub);opacity:.45;letter-spacing:2px;
  text-align:center;
}
</style>
</head>
<body>
<div class="page">
  <div class="kicker">__KICKER__</div>
  <div class="hero">
    <div class="icon-frame">__ICON__</div>
    <div class="brand-main" id="bm">__BRAND_MAIN__</div>
    __BRAND_SUB__
    <div class="slogan">__SLOGAN__</div>
    __DESC__
  </div>
  <div class="watermark">__WATERMARK__</div>
</div>
<script>
(function(){
  var el=document.getElementById('bm');
  if(!el)return;
  function fit(){
    var maxW=el.clientWidth||880;
    el.style.fontSize='120px';
    var g=0;
    while(el.scrollWidth>maxW+2 && g<50){
      el.style.fontSize=(parseFloat(el.style.fontSize)-4)+'px';
      g++;
    }
  }
  fit();
  if(document.readyState!=='complete') window.addEventListener('load',fit);
})();
</script>
</body>
</html>
