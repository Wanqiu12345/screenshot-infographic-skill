<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{
  --page-bg: __PAGE_BG__;
  --card-bg: __CARD_BG__;
  --accent: __ACCENT__;
  --accent-soft: __ACCENT_SOFT__;
  --secondary: __SECONDARY__;
  --accent2: __ACCENT2__;
  --accent2-soft: __ACCENT2_SOFT__;
  --text-main: __TEXT_MAIN__;
  --text-sub: __TEXT_SUB__;
  --line: __LINE__;
  --radius: __RADIUS__px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--page-bg);}
.page{
  width:1080px;height:1440px;background:var(--page-bg);
  padding:70px 64px 56px;
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text-main);display:flex;flex-direction:column;
}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;}
.brandbox{display:flex;align-items:center;gap:18px;}
.logo{width:60px;height:60px;border-radius:calc(var(--radius) * 0.9);overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent);}
.logo img{width:100%;height:100%;object-fit:cover;display:block;}
.logo svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;}
.logo-text{color:#fff;font-size:30px;font-weight:700;line-height:1;}
.brand h1{font-size:40px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
.brand .sub{font-size:19px;color:var(--text-sub);margin-top:8px;}
.badge{font-size:18px;color:#fff;font-weight:700;
  background:linear-gradient(135deg, var(--accent), var(--secondary));
  border-radius:999px;padding:11px 22px;white-space:nowrap;box-shadow:0 6px 16px var(--accent-soft);}
.shot{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--line);
  overflow:hidden;margin-bottom:40px;}
.bar{display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid var(--line);}
.dot{width:13px;height:13px;border-radius:50%;}
.url{flex:1;text-align:center;font-size:16px;color:var(--text-sub);
  background:var(--page-bg);border-radius:8px;padding:6px 0;margin:0 120px;}
.shot img{display:block;width:100%;}
.list-title{display:flex;align-items:center;gap:16px;margin-bottom:26px;}
.list-title i{flex:1;height:2px;background:var(--line);border-radius:2px;}
.list-title h2{font-size:24px;font-weight:700;color:var(--text-main);}
.list{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;flex:1;align-content:start;}
.item{display:flex;align-items:flex-start;gap:16px;background:var(--card-bg);
  border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--radius);padding:18px 20px;}
.ic{width:56px;height:56px;border-radius:calc(var(--radius) * 0.75);background:var(--cs);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 14px var(--cs);}
.ic svg{width:30px;height:30px;stroke:var(--c);}
.itxt{flex:1;padding-top:2px;}
.itxt h3{font-size:25px;font-weight:700;margin-bottom:7px;color:var(--c);}
.itxt p{font-size:19px;line-height:1.55;color:var(--text-sub);}
.num{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;
  font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 10px var(--cs);}
.footer{margin-top:30px;display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:18px;color:var(--text-sub);}
.footer .pg{color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="brandbox">
      __LOGO__
      <div class="brand">
        <h1>__BRAND__</h1>
        <div class="sub">__SUBTITLE__</div>
      </div>
    </div>
    <div class="badge">__BADGE__</div>
  </div>

  <div class="shot">
    <div class="bar">
      <div class="dot" style="background:#ec6a5e"></div>
      <div class="dot" style="background:#f4bf4f"></div>
      <div class="dot" style="background:#61c554"></div>
      <div class="url">__URLBAR__</div>
    </div>
    <img src="__SCREENSHOT__" alt="screenshot">
  </div>

  <div class="list-title"><i></i><h2>功能拆解</h2><i></i></div>
  <div class="list">__ITEMS__</div>

  __FOOTER__
</div>
</body>
</html>
